
name: Todo Summary Assistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-build:
    name: Build and test backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/todo-summary-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/todo-summary-assistant/pom.xml

      - name: Build and test
        run: mvn -B clean verify

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Frontend/todo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t todo-summary-backend:ci \
            Backend/todo-summary-assistant

      - name: Build frontend Docker image
        run: |
          docker build \
            -t todo-summary-frontend:ci \
            Frontend/todo
