
name: Todo Summary Assistant CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  backend-build:
    name: Build and test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/todo-summary-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: Backend/todo-summary-assistant/pom.xml

      - name: Build and test
        run: mvn -B clean verify

  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/todo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/todo/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build React application
        run: npm run build

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            -t todo-summary-backend:ci \
            Backend/todo-summary-assistant

      - name: Build frontend Docker image
        run: |
          docker build \
            -t todo-summary-frontend:ci \
            Frontend/todo

  deploy:
    name: Deploy to fresh EC2
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Verify GitHub deployment context
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Repository: $REPOSITORY"
          echo "Branch/ref: $REF"
          echo "Event: $EVENT"

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "sudo -u ubuntu -H git -c safe.directory=/home/ubuntu/TodoSummaryAssistant-Fresh -C /home/ubuntu/TodoSummaryAssistant-Fresh pull --ff-only origin main",
              "sudo -u ubuntu sed -i \"s|127.0.0.1:3002:80|80:80|\" /home/ubuntu/TodoSummaryAssistant-Fresh/docker-compose.yml",
              "sudo docker compose -f /home/ubuntu/TodoSummaryAssistant-Fresh/docker-compose.yml config --quiet",
              "sudo docker compose -f /home/ubuntu/TodoSummaryAssistant-Fresh/docker-compose.yml up -d --build",
              "sudo -u ubuntu git -c safe.directory=/home/ubuntu/TodoSummaryAssistant-Fresh -C /home/ubuntu/TodoSummaryAssistant-Fresh log -1 --oneline"
            ]' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"; then
            echo "Deployment command did not complete successfully."
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query 'Status' \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed with status: $STATUS"
            exit 1
          fi

          echo "Deployment completed successfully."
